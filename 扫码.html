<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>扫码查看H5</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#FDFBF7;font-family:sans-serif}.box{text-align:center;padding:40px;background:#fff;border-radius:16px;box-shadow:0 4px 30px rgba(0,0,0,0.08)}h2{color:#145243;margin-bottom:8px}p{color:#6B625B;font-size:14px;margin-bottom:20px}#qr{margin:0 auto}</style></head>
<body><div class="box">
<h2>长江大保护十周年 H5</h2>
<p>手机扫描二维码，手机和电脑需在同一 WiFi</p>
<div id="qr"></div>
<p style="margin-top:16px;font-size:12px;color:#A09890">http://172.26.154.60:8080</p>
</div>
<script>
new QRCode(document.getElementById('qr'),{
  text:'http://172.26.154.60:8080',
  width:240,height:240,
  colorDark:'#145243',colorLight:'#ffffff'
})
</script></body></html>
